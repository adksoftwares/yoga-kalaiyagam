<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Emblem / Icon -->
  <g transform="translate(10, 5)">
    <!-- Aura circle -->
    <circle cx="40" cy="40" r="36" fill="#FEF3C7" opacity="0.6"/>
    <circle cx="40" cy="40" r="33" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="3 3"/>
    
    <!-- Outer Lotus Petals -->
    <path d="M40 70 C22 68 12 52 14 36 C22 45 32 50 40 52 C48 50 58 45 66 36 C68 52 58 68 40 70 Z" fill="url(#leafGrad)" opacity="0.85"/>
    <path d="M40 68 C28 62 20 46 25 32 C31 40 36 44 40 45 C44 44 49 40 55 32 C60 46 52 62 40 68 Z" fill="url(#goldGrad)" opacity="0.9"/>
    
    <!-- Center Lotus Petal / Silhouette -->
    <path d="M40 18 C33 28 32 40 40 50 C48 40 47 28 40 18 Z" fill="url(#goldGrad)"/>
    
    <!-- Meditating Yogi Head & Crown -->
    <circle cx="40" cy="28" r="4.5" fill="#78350F"/>
    <!-- Yogi Arms & Torso in Namaste -->
    <path d="M40 34 L36 43 L44 43 Z" fill="#78350F"/>
    <path d="M36 37 C34 40 31 43 28 44 C33 46 36 44 38 41 Z" fill="#78350F"/>
    <path d="M44 37 C46 40 49 43 52 44 C47 46 44 44 42 41 Z" fill="#78350F"/>

    <!-- Sparkle / Bindi -->
    <circle cx="40" cy="20" r="1.5" fill="#F59E0B" filter="url(#glow)"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(95, 18)">
    <!-- Tamil Title -->
    <text x="0" y="24" font-family="'Noto Sans Tamil', 'Mukta Malar', 'Latha', sans-serif" font-weight="800" font-size="21" fill="#78350F" letter-spacing="0.5">
      ஸ்ரீ ஐஸ்வர்யம் யோகா
    </text>
    
    <!-- English Subtitle -->
    <text x="1" y="44" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-weight="700" font-size="14.5" fill="#B45309" letter-spacing="3.2">
      AISWARYAM YOGA
    </text>
    
    <!-- Tagline in Tamil / English -->
    <text x="2" y="59" font-family="'Mukta Malar', sans-serif" font-weight="500" font-size="10.5" fill="#047857" letter-spacing="0.8">
      ஆரோக்கியம் • அமைதி • ஆனந்தம்
    </text>
  </g>
</svg>
