<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="goldArch" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="50%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#goldArch)"/>

  <!-- Stage Arch & Diyas / Lamps -->
  <path d="M50 350 C50 100 550 100 550 350" stroke="#FDE68A" stroke-width="4" stroke-dasharray="10 8" fill="none"/>
  
  <!-- Master handing certificate to graduate -->
  <!-- Master (Left) -->
  <g transform="translate(220, 240)">
    <circle cx="0" cy="-60" r="14" fill="#FDE68A"/>
    <rect x="-14" y="-42" width="28" height="60" rx="4" fill="#FEF3C7"/>
    <!-- Master Kavi Shawl -->
    <path d="M-14 -35 Q0 10 14 -35" stroke="#D97706" stroke-width="6" fill="none"/>
    <line x1="12" y1="-25" x2="45" y2="-15" stroke="#FDE68A" stroke-width="5"/>
  </g>

  <!-- Golden Scroll / Diploma Certificate in hands -->
  <g transform="translate(300, 222)">
    <rect x="-25" y="-12" width="50" height="24" rx="3" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
    <line x1="-18" y1="-5" x2="18" y2="-5" stroke="#B45309" stroke-width="1.5"/>
    <line x1="-18" y1="2" x2="15" y2="2" stroke="#B45309" stroke-width="1.5"/>
    <!-- Red ribbon seal -->
    <circle cx="0" cy="12" r="6" fill="#DC2626"/>
  </g>

  <!-- Graduate (Right) receiving in reverence (Namaste/Bowing) -->
  <g transform="translate(380, 240)">
    <circle cx="0" cy="-55" r="13" fill="#FDE68A"/>
    <path d="M-12 -38 L12 -38 L16 20 L-16 20 Z" fill="#FFFFFF"/>
    <line x1="-12" y1="-25" x2="-45" y2="-15" stroke="#FDE68A" stroke-width="5"/>
  </g>

  <!-- Banner overlay -->
  <rect x="0" y="325" width="600" height="75" fill="rgba(69, 26, 3, 0.9)"/>
  <text x="30" y="355" font-family="'Noto Sans Tamil', sans-serif" font-weight="700" font-size="19" fill="#FDE68A">
    யோகா ஆசிரியர் பயிற்சி (TTC 200/500 hrs) பட்டமளிப்பு
  </text>
  <text x="30" y="380" font-family="'Mukta Malar', sans-serif" font-size="13" fill="#FEF3C7">
    Certified Yoga Teacher Training • அரசு மற்றும் சர்வதேச சான்றிதழ்
  </text>
  <rect x="490" y="342" width="85" height="28" rx="14" fill="#F59E0B"/>
  <text x="532" y="361" font-family="sans-serif" font-size="12" font-weight="600" fill="#78350F" text-anchor="middle">வருடாந்திரம்</text>
</svg>
