<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="60%" stop-color="#065F46"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <linearGradient id="sunDay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#bgGrad1)"/>
  
  <!-- Sun and energy rays -->
  <circle cx="300" cy="130" r="70" fill="url(#sunDay)" opacity="0.9"/>
  <circle cx="300" cy="130" r="95" stroke="#FDE047" stroke-width="2" stroke-dasharray="8 6" opacity="0.4"/>
  
  <!-- Crowd of Yoga practitioners in unison (Vrikshasana - Tree Pose) -->
  <!-- Center practitioner -->
  <g transform="translate(300, 240) scale(1.1)">
    <circle cx="0" cy="-60" r="10" fill="#FEF3C7"/>
    <!-- Hands raised high in Namaste -->
    <path d="M-4 -52 L0 -78 L4 -52 Z" fill="#F59E0B"/>
    <path d="M-8 -38 L-4 -52 L4 -52 L8 -38 Z" fill="#FDE68A"/>
    <path d="M-10 -38 L-6 10 L6 10 L10 -38 Z" fill="#FFFFFF"/>
    <!-- Standing leg and bent leg -->
    <rect x="-3" y="10" width="6" height="50" rx="2" fill="#FFFFFF"/>
    <path d="M0 20 L22 35 L0 42 Z" fill="#FDE68A"/>
  </g>

  <!-- Left practitioners -->
  <g transform="translate(200, 255) scale(0.9)">
    <circle cx="0" cy="-60" r="10" fill="#FEF3C7"/>
    <path d="M-4 -52 L0 -78 L4 -52 Z" fill="#F59E0B"/>
    <path d="M-8 -38 L-4 -52 L4 -52 L8 -38 Z" fill="#FDE68A"/>
    <rect x="-8" y="-38" width="16" height="48" rx="3" fill="#E2E8F0"/>
    <rect x="-3" y="10" width="6" height="50" rx="2" fill="#E2E8F0"/>
    <path d="M0 20 L-20 35 L0 42 Z" fill="#FDE68A"/>
  </g>
  <g transform="translate(100, 270) scale(0.75)">
    <circle cx="0" cy="-60" r="10" fill="#FEF3C7"/>
    <path d="M-4 -52 L0 -78 L4 -52 Z" fill="#F59E0B"/>
    <rect x="-8" y="-38" width="16" height="48" rx="3" fill="#CBD5E1"/>
    <rect x="-3" y="10" width="6" height="50" rx="2" fill="#CBD5E1"/>
  </g>

  <!-- Right practitioners -->
  <g transform="translate(400, 255) scale(0.9)">
    <circle cx="0" cy="-60" r="10" fill="#FEF3C7"/>
    <path d="M-4 -52 L0 -78 L4 -52 Z" fill="#F59E0B"/>
    <path d="M-8 -38 L-4 -52 L4 -52 L8 -38 Z" fill="#FDE68A"/>
    <rect x="-8" y="-38" width="16" height="48" rx="3" fill="#E2E8F0"/>
    <rect x="-3" y="10" width="6" height="50" rx="2" fill="#E2E8F0"/>
    <path d="M0 20 L20 35 L0 42 Z" fill="#FDE68A"/>
  </g>
  <g transform="translate(500, 270) scale(0.75)">
    <circle cx="0" cy="-60" r="10" fill="#FEF3C7"/>
    <path d="M-4 -52 L0 -78 L4 -52 Z" fill="#F59E0B"/>
    <rect x="-8" y="-38" width="16" height="48" rx="3" fill="#CBD5E1"/>
    <rect x="-3" y="10" width="6" height="50" rx="2" fill="#CBD5E1"/>
  </g>

  <!-- Ground Banner overlay -->
  <rect x="0" y="325" width="600" height="75" fill="rgba(0,0,0,0.6)"/>
  <text x="30" y="355" font-family="'Noto Sans Tamil', sans-serif" font-weight="700" font-size="19" fill="#FBBF24">
    சர்வதேச யோகா தினப் பெருவிழா (500+ பங்கேற்பாளர்கள்)
  </text>
  <text x="30" y="380" font-family="'Mukta Malar', sans-serif" font-size="13" fill="#E2E8F0">
    International Yoga Day Mega Celebration • ஸ்ரீ ஐஸ்வர்யம் யோகா மையம்
  </text>
  <rect x="490" y="342" width="85" height="28" rx="14" fill="#059669"/>
  <text x="532" y="361" font-family="sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">ஜூன் 21</text>
</svg>
