<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="kidsGrad" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="50%" stop-color="#DBEAFE"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#kidsGrad)"/>

  <!-- Cheerful colorful background decorations -->
  <circle cx="90" cy="90" r="45" fill="#FDE047" opacity="0.6"/>
  <circle cx="510" cy="110" r="35" fill="#F472B6" opacity="0.5"/>
  <circle cx="480" cy="220" r="25" fill="#34D399" opacity="0.5"/>

  <!-- Three happy children doing yoga poses -->
  <!-- Child 1: Lotus / Smiling -->
  <g transform="translate(180, 240)">
    <circle cx="0" cy="-45" r="14" fill="#FBBF24"/>
    <circle cx="0" cy="-45" r="12" fill="#FDE68A"/>
    <!-- Smile -->
    <path d="M-5 -42 Q0 -37 5 -42" stroke="#B45309" stroke-width="2" fill="none"/>
    <ellipse cx="-4" cy="-47" rx="1.5" ry="2" fill="#B45309"/>
    <ellipse cx="4" cy="-47" rx="1.5" ry="2" fill="#B45309"/>
    <!-- Body -->
    <path d="M-10 -30 L-14 12 L14 12 L10 -30 Z" fill="#3B82F6"/>
    <!-- Crossed legs -->
    <ellipse cx="0" cy="18" rx="28" ry="10" fill="#1D4ED8"/>
    <!-- Hands in Chin Mudra -->
    <circle cx="-16" cy="10" r="5" fill="#FDE68A"/>
    <circle cx="16" cy="10" r="5" fill="#FDE68A"/>
  </g>

  <!-- Child 2: Cobra pose / Bhujangasana -->
  <g transform="translate(320, 240)">
    <circle cx="35" cy="-28" r="13" fill="#FDE68A"/>
    <path d="M30 -25 Q35 -20 40 -25" stroke="#B45309" stroke-width="1.8" fill="none"/>
    <!-- Arching back -->
    <path d="M-40 22 Q-10 22 15 15 Q30 5 35 -15" stroke="#EC4899" stroke-width="14" stroke-linecap="round" fill="none"/>
    <!-- Arms supporting on ground -->
    <line x1="28" y1="0" x2="25" y2="25" stroke="#FDE68A" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Child 3: Balance Tree Pose -->
  <g transform="translate(440, 230)">
    <circle cx="0" cy="-55" r="12" fill="#FDE68A"/>
    <path d="M-4 -68 L0 -45 L4 -68 Z" fill="#10B981"/>
    <!-- Body -->
    <rect x="-7" y="-42" width="14" height="35" rx="3" fill="#10B981"/>
    <!-- Standing leg & bent knee -->
    <rect x="-3" y="-7" width="6" height="38" rx="2" fill="#047857"/>
    <path d="M0 0 L16 12 L0 18 Z" fill="#FDE68A"/>
  </g>

  <!-- Banner overlay -->
  <rect x="0" y="325" width="600" height="75" fill="rgba(30, 58, 138, 0.85)"/>
  <text x="30" y="355" font-family="'Noto Sans Tamil', sans-serif" font-weight="700" font-size="19" fill="#93C5FD">
    சுட்டிஸ் யோகா &amp; நினைவாற்றல் மேம்பாட்டு முகாம்
  </text>
  <text x="30" y="380" font-family="'Mukta Malar', sans-serif" font-size="13" fill="#E2E8F0">
    Kids Yoga Camp • அறிவுக் கூர்மை, உயர வளர்ச்சி மற்றும் அமைதியான மனம்
  </text>
  <rect x="490" y="342" width="85" height="28" rx="14" fill="#3B82F6"/>
  <text x="532" y="361" font-family="sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">விடுமுறை</text>
</svg>
