<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="zenGrad" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="50%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <radialGradient id="bowlSound" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#zenGrad)"/>

  <!-- Sound wave concentric rings -->
  <circle cx="300" cy="180" r="180" stroke="#818CF8" stroke-width="1" stroke-dasharray="8 6" opacity="0.3"/>
  <circle cx="300" cy="180" r="140" stroke="#C084FC" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.4"/>
  <circle cx="300" cy="180" r="100" stroke="#FDE68A" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
  <circle cx="300" cy="180" r="60" fill="url(#bowlSound)"/>

  <!-- Singing bowl / Meditation Bell -->
  <g transform="translate(300, 240)">
    <path d="M-40 0 C-40 35 40 35 40 0 Z" fill="#D97706" stroke="#F59E0B" stroke-width="3"/>
    <ellipse cx="0" cy="0" rx="40" ry="10" fill="#B45309" stroke="#FBBF24" stroke-width="2"/>
    <!-- Wooden striker -->
    <rect x="25" y="-30" width="8" height="35" rx="3" fill="#78350F" transform="rotate(25 25 -30)"/>
    <!-- Lotus underneath -->
    <path d="M-60 25 C-30 45 30 45 60 25 C40 15 -40 15 -60 25 Z" fill="#4338CA"/>
  </g>

  <!-- Yogi meditating in soft glow -->
  <g transform="translate(300, 140) scale(0.85)">
    <circle cx="0" cy="-45" r="14" fill="#FDE68A"/>
    <path d="M-18 -25 L18 -25 L24 25 L-24 25 Z" fill="#E0E7FF"/>
    <ellipse cx="0" cy="30" rx="38" ry="14" fill="#C7D2FE"/>
    <!-- Mudra hands -->
    <circle cx="-25" cy="22" r="5" fill="#FDE68A"/>
    <circle cx="25" cy="22" r="5" fill="#FDE68A"/>
  </g>

  <!-- Banner overlay -->
  <rect x="0" y="325" width="600" height="75" fill="rgba(15, 23, 42, 0.85)"/>
  <text x="30" y="355" font-family="'Noto Sans Tamil', sans-serif" font-weight="700" font-size="19" fill="#A5B4FC">
    ஒலி சிகிச்சை &amp; ஆழ்நிலை தியானப் பட்டறை
  </text>
  <text x="30" y="380" font-family="'Mukta Malar', sans-serif" font-size="13" fill="#E2E8F0">
    Sound Healing &amp; Deep Chakra Meditation • மன அமைதிக்கான சிறப்பு முகாம்
  </text>
  <rect x="490" y="342" width="85" height="28" rx="14" fill="#6366F1"/>
  <text x="532" y="361" font-family="sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">சிறப்பு</text>
</svg>
