<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDF2F8"/>
      <stop offset="50%" stop-color="#FCE7F3"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#roseGrad)"/>

  <!-- Floral and Mandalas -->
  <circle cx="300" cy="180" r="110" stroke="#FB7185" stroke-width="2" stroke-dasharray="8 6" opacity="0.5"/>
  <circle cx="300" cy="180" r="85" fill="#FFE4E6" opacity="0.6"/>

  <!-- Woman doing elegant Dancer Pose / Natarajasana -->
  <g transform="translate(300, 240)">
    <circle cx="-15" cy="-75" r="11" fill="#78350F"/>
    <ellipse cx="-15" cy="-75" rx="10" ry="11" fill="#FDE68A"/>
    <!-- Torso arched gracefully -->
    <path d="M-15 -60 C-5 -30 10 -20 20 5" stroke="#E11D48" stroke-width="12" stroke-linecap="round" fill="none"/>
    <!-- Left standing leg -->
    <line x1="20" y1="5" x2="20" y2="65" stroke="#BE123C" stroke-width="8" stroke-linecap="round"/>
    <!-- Right leg bent upward backwards -->
    <path d="M20 5 C5 2 -15 -25 -25 -55" stroke="#BE123C" stroke-width="7" stroke-linecap="round" fill="none"/>
    <!-- Right arm reaching back grasping foot -->
    <path d="M-12 -50 C-18 -75 -25 -65 -25 -55" stroke="#FDE68A" stroke-width="5" fill="none"/>
    <!-- Left arm extended forward in Gyan mudra -->
    <line x1="-12" y1="-50" x2="-65" y2="-45" stroke="#FDE68A" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Banner overlay -->
  <rect x="0" y="325" width="600" height="75" fill="rgba(159, 18, 57, 0.88)"/>
  <text x="30" y="355" font-family="'Noto Sans Tamil', sans-serif" font-weight="700" font-size="19" fill="#FECDD3">
    பெண்கள் நலன் &amp; ஹார்மோன் சமநிலை சிறப்பு யோகா
  </text>
  <text x="30" y="380" font-family="'Mukta Malar', sans-serif" font-size="13" fill="#FFF1F2">
    Women Wellness, PCOD &amp; Prenatal Therapy • நலம் தரும் இயற்கை யோகா
  </text>
  <rect x="490" y="342" width="85" height="28" rx="14" fill="#BE123C"/>
  <text x="532" y="361" font-family="sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">மாதந்தோறும்</text>
</svg>
