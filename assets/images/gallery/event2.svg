<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFEDD5"/>
      <stop offset="35%" stop-color="#FED7AA"/>
      <stop offset="65%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#oceanGrad)"/>

  <!-- Morning Sun on Ocean Horizon -->
  <circle cx="300" cy="180" r="60" fill="#F97316"/>
  <!-- Sun Reflection on water -->
  <ellipse cx="300" cy="280" rx="90" ry="12" fill="#FDBA74" opacity="0.6"/>
  <ellipse cx="300" cy="310" rx="140" ry="8" fill="#FDBA74" opacity="0.4"/>

  <!-- Golden Beach Sand Shoreline -->
  <path d="M0 320 Q200 290 600 325 L600 400 L0 400 Z" fill="#D97706" opacity="0.85"/>

  <!-- Warrior Pose Yogi (Virabhadrasana) -->
  <g transform="translate(300, 270)">
    <circle cx="0" cy="-65" r="9" fill="#1E293B"/>
    <!-- Head & Neck -->
    <rect x="-6" y="-55" width="12" height="30" rx="4" fill="#1E293B"/>
    <!-- Outstretched Arms -->
    <line x1="-55" y1="-45" x2="55" y2="-45" stroke="#1E293B" stroke-width="7" stroke-linecap="round"/>
    <!-- Legs in deep lunge -->
    <path d="M-6 -26 L-40 45 L-55 45" stroke="#1E293B" stroke-width="9" stroke-linecap="round" fill="none"/>
    <path d="M6 -26 L35 0 L35 45" stroke="#1E293B" stroke-width="9" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Banner overlay -->
  <rect x="0" y="325" width="600" height="75" fill="rgba(15, 23, 42, 0.75)"/>
  <text x="30" y="355" font-family="'Noto Sans Tamil', sans-serif" font-weight="700" font-size="19" fill="#FDBA74">
    கடற்கரை சூரிய நமஸ்காரம் &amp; பிராணாயாம முகாம்
  </text>
  <text x="30" y="380" font-family="'Mukta Malar', sans-serif" font-size="13" fill="#E2E8F0">
    Sunrise Beach Yoga Retreat • இயற்கை சூழலில் உடல் நலம்
  </text>
  <rect x="490" y="342" width="85" height="28" rx="14" fill="#D97706"/>
  <text x="532" y="361" font-family="sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">ஞாயிறு</text>
</svg>
