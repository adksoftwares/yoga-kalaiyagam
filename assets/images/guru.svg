<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="guruAura" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#FDE68A" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="robeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="450" rx="24" fill="#FFFDF8"/>
  <circle cx="200" cy="180" r="160" fill="url(#guruAura)"/>
  <circle cx="200" cy="180" r="130" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>

  <!-- Master / Yogacharya Figure -->
  <g transform="translate(200, 150)">
    <!-- Aura Halo -->
    <circle cx="0" cy="0" r="85" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2" opacity="0.7"/>

    <!-- Head & Face -->
    <ellipse cx="0" cy="-10" rx="36" ry="44" fill="#F8C798"/>
    <!-- Gentle Beard & Moustache (Yogic Guru) -->
    <path d="M-30 -10 C-32 30 -20 65 0 75 C20 65 32 30 30 -10 C18 -5 -18 -5 -30 -10 Z" fill="#4B5563"/>
    <path d="M-22 5 C-12 18 12 18 22 5 C15 1 0 1 -22 5 Z" fill="#374151"/>

    <!-- Hair / Topknot (Jata / Bun) -->
    <circle cx="0" cy="-56" rx="22" ry="18" fill="#1F2937"/>
    <ellipse cx="0" cy="-48" rx="34" ry="24" fill="#1F2937"/>
    <circle cx="0" cy="-68" r="14" fill="#1F2937"/>

    <!-- Sacred Vibhuti & Kumkum on Forehead -->
    <!-- Vibhuti 3 lines -->
    <rect x="-18" y="-32" width="36" height="2" rx="1" fill="#FFFFFF" opacity="0.9"/>
    <rect x="-18" y="-28" width="36" height="2" rx="1" fill="#FFFFFF" opacity="0.9"/>
    <rect x="-18" y="-24" width="36" height="2" rx="1" fill="#FFFFFF" opacity="0.9"/>
    <!-- Kumkum dot / Tilakam -->
    <circle cx="0" cy="-28" r="2.5" fill="#DC2626"/>

    <!-- Calm Eyes (Meditative half-closed) -->
    <path d="M-20 -15 Q-14 -12 -8 -15" stroke="#374151" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M8 -15 Q14 -12 20 -15" stroke="#374151" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Gentle smile -->
    <path d="M-8 10 Q0 16 8 10" stroke="#78350F" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Rudraksha Mala / Garland -->
    <path d="M-28 42 C-20 70 20 70 28 42" stroke="#78350F" stroke-width="4" stroke-dasharray="4 4" fill="none"/>

    <!-- Saffron Robe / Shawl (Kavi Vasthiram) -->
    <path d="M-80 140 C-75 65 -45 42 0 42 C45 42 75 65 80 140 C50 165 -50 165 -80 140 Z" fill="url(#robeGrad)"/>
    <!-- Robe folds & details -->
    <path d="M-25 46 Q-45 100 -55 140" stroke="#B45309" stroke-width="2" fill="none"/>
    <path d="M25 46 Q45 100 55 140" stroke="#B45309" stroke-width="2" fill="none"/>
    <path d="M-15 50 Q0 100 0 145" stroke="#FDE68A" stroke-width="1.5" stroke-opacity="0.8" fill="none"/>

    <!-- Hands in Chin Mudra / Namaskara -->
    <circle cx="-12" cy="115" r="9" fill="#F8C798"/>
    <circle cx="12" cy="115" r="9" fill="#F8C798"/>
    <ellipse cx="0" cy="112" rx="15" ry="12" fill="#F3A765"/>
  </g>

  <!-- Caption Plaque -->
  <g transform="translate(50, 360)">
    <rect width="300" height="65" rx="14" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.06))"/>
    <text x="150" y="26" font-family="'Noto Sans Tamil', sans-serif" font-weight="700" font-size="15" fill="#78350F" text-anchor="middle">
      யோகாச்சார்யா முனைவர் சுந்தரமூர்த்தி
    </text>
    <text x="150" y="46" font-family="'Mukta Malar', sans-serif" font-weight="500" font-size="12" fill="#047857" text-anchor="middle">
      நிறுவனர் &amp; தலைமை யோக குரு (25+ வருட அனுபவம்)
    </text>
  </g>
</svg>
