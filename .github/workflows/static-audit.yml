name: Static site audit

on:
  push:
    branches: [main, "audit/**"]
  pull_request:
    branches: [main]

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax, JSON, and local HTML references
        run: node scripts/check-static-site.mjs
